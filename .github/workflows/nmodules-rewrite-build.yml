name: nModules Rewrite baseline build

on:
  push:
    branches:
      - win11-0.25
  workflow_dispatch:

jobs:
  build-nmodules-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout LiteStep branch
        uses: actions/checkout@v4
        with:
          path: LiteStep

      - name: Checkout nModules
        uses: actions/checkout@v4
        with:
          repository: alur/nModules
          path: nModules

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Retarget nModules Rewrite to current toolchain
        shell: pwsh
        run: |
          Get-ChildItem nModules/Rewrite -Recurse -Filter *.vcxproj | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text.Replace("<PlatformToolset>v141</PlatformToolset>", "<PlatformToolset>v143</PlatformToolset>")
            $text = $text.Replace("<WindowsTargetPlatformVersion>10.0.14393.0</WindowsTargetPlatformVersion>", "<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>")
            Set-Content $_.FullName $text -Encoding UTF8
          }

          $props = "nModules/Rewrite/nModules.props"
          $lsapiLibDir = (Resolve-Path "nModules/Rewrite/libs/64").Path
          $lsapiLib = Join-Path $lsapiLibDir "lsapi.lib"
          if (-not (Test-Path $lsapiLib)) {
            throw "Missing expected nModules lsapi.lib at $lsapiLib"
          }
          Write-Host "Using lsapi.lib from $lsapiLib"

          $text = Get-Content $props -Raw
          $escapedLibDir = [System.Security.SecurityElement]::Escape($lsapiLibDir)
          $text = [regex]::Replace(
            $text,
            '<AdditionalLibraryDirectories>[^<]*</AdditionalLibraryDirectories>',
            "<AdditionalLibraryDirectories>$escapedLibDir</AdditionalLibraryDirectories>")
          Set-Content $props $text -Encoding UTF8

          $eventHeader = "nModules/Rewrite/nCore/EventHandler.hpp"
          $text = Get-Content $eventHeader -Raw
          $text = $text.Replace("#include <unordered_map>", "#include <string>`r`n#include <unordered_map>")
          Set-Content $eventHeader $text -Encoding UTF8

          $pane = "nModules/Rewrite/nCore/Pane.cpp"
          $text = Get-Content $pane -Raw
          $text = $text.Replace("#include <strsafe.h>", "#include <strsafe.h>`r`n#include <string>")
          Set-Content $pane $text -Encoding UTF8

          $trayManager = "nModules/Rewrite/nTray/TrayManager.hpp"
          $text = Get-Content $trayManager -Raw
          $text = $text.Replace("#include <map>", "#include <map>`r`n#include <string>")
          Set-Content $trayManager $text -Encoding UTF8

      - name: Build nCore x64
        shell: pwsh
        run: |
          msbuild nModules/Rewrite/nCore/nCore.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal

      - name: Build nDesk x64
        shell: pwsh
        run: |
          msbuild nModules/Rewrite/nDesk/nDesk.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal

      - name: Build nTask x64
        shell: pwsh
        run: |
          msbuild nModules/Rewrite/nTask/nTask.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal

      - name: Build nTray x64
        shell: pwsh
        run: |
          msbuild nModules/Rewrite/nTray/nTray.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal

      - name: Build nPopup x64
        shell: pwsh
        run: |
          msbuild nModules/Rewrite/nPopup/nPopup.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal

      - name: Stage nModules Rewrite x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path nModules-package | Out-Null
          Copy-Item nModules/Rewrite/nCore/bin/Debug_x64/nCore.dll nModules-package/
          Copy-Item nModules/Rewrite/nDesk/bin/Debug_x64/nDesk.dll nModules-package/
          Copy-Item nModules/Rewrite/nTask/bin/Debug_x64/nTask.dll nModules-package/
          Copy-Item nModules/Rewrite/nTray/bin/Debug_x64/nTray.dll nModules-package/
          Copy-Item nModules/Rewrite/nPopup/bin/Debug_x64/nPopup.dll nModules-package/

      - name: Upload nModules Rewrite x64
        uses: actions/upload-artifact@v4
        with:
          name: nModules-Rewrite-Debug-x64
          path: nModules-package/
          if-no-files-found: error
